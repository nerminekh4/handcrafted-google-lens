<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Handcrafted Lens</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script>
    // Afficher les erreurs serveur (4xx/5xx) dans #result
    document.addEventListener('htmx:responseError', function(evt) {
      document.getElementById('result').innerHTML =
        '<div class="result-card"><div class="result-icon">⚠️</div>' +
        '<div class="result-text"><p>Erreur serveur (' + evt.detail.xhr.status + ') — ' +
        (evt.detail.xhr.responseText || 'vérifiez la console du terminal') + '</p></div></div>';
    });
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #18181b;
      --surface2: #27272a;
      --accent: #7c3aed;
      --accent-light: #a78bfa;
      --accent-glow: rgba(124, 58, 237, 0.35);
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --border: #3f3f46;
      --radius: 16px;
      --success: #22c55e;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100svh;
      padding: 24px 16px 40px;
    }

    /* ── Header ── */
    header {
      width: 100%;
      max-width: 480px;
      text-align: center;
      margin-bottom: 32px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent), #c026d3);
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 20px;
    }

    .logo-text {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(90deg, var(--accent-light), #e879f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* ── Main card ── */
    main {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    /* ── Upload zone ── */
    .upload-zone {
      display: block;
      position: relative;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: transparent;
    }

    .upload-zone:hover,
    .upload-zone.drag-over {
      border-color: var(--accent);
      background: var(--accent-glow);
    }

    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
      display: block;
    }

    .upload-label {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    .upload-hint {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* ── Preview ── */
    #preview-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #preview-container.visible {
      display: flex;
    }

    #preview {
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .preview-name {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
      word-break: break-all;
    }

    /* ── Buttons ── */
    .btn-row {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #9333ea);
      color: #fff;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* Camera shortcut (mobile) */
    .camera-btn-wrap {
      display: flex;
      justify-content: center;
    }

    .camera-shortcut {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 28px;
      background: linear-gradient(135deg, #1d1d20, #27272a);
      border: 1px solid var(--border);
      border-radius: 50px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .camera-shortcut:hover {
      border-color: var(--accent-light);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .camera-shortcut input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    /* ── Spinner ── */
    #spinner {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 28px 0 8px;
    }

    .spinner-ring {
      width: 40px;
      height: 40px;
      border: 3px solid var(--surface2);
      border-top-color: var(--accent-light);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .spinner-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }

    /* ── Result card ── */
    #result { animation: fadeUp 0.35s ease; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent-light);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .result-icon {
      font-size: 1.4rem;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .result-text p {
      font-size: 0.92rem;
      line-height: 1.65;
      color: var(--text);
      margin-bottom: 8px;
    }

    .result-text p:last-child { margin-bottom: 0; }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Footer ── */
    footer {
      margin-top: 40px;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      opacity: 0.6;
    }

    /* ── Responsive tweaks ── */
    @media (max-width: 360px) {
      .logo-text { font-size: 1.1rem; }
      .btn { font-size: 0.85rem; padding: 12px 14px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-icon">🔭</div>
      <span class="logo-text">Handcrafted Lens</span>
    </div>
    <p class="tagline">Prenez une photo — l'IA vous décrit ce qu'elle voit</p>
  </header>

  <main>
    <!-- Upload card -->
    <div class="card">
      <!-- fileInput hors du dropZone pour qu'il soit toujours accessible -->
      <input type="file" name="file" id="fileInput" accept="image/*"
             style="display:none" />

      <!-- Drag & drop / file pick zone (label déclenche fileInput) -->
      <label class="upload-zone" id="dropZone" for="fileInput">
        <span class="upload-icon">🖼️</span>
        <p class="upload-label">Glissez une image ici</p>
        <p class="upload-hint">ou cliquez pour choisir un fichier</p>
      </label>

      <!-- Camera shortcut (mobile) -->
      <div class="camera-btn-wrap" style="margin-top:16px;">
        <label class="camera-shortcut">
          📷 Prendre une photo
          <input type="file" accept="image/*" capture="environment" id="cameraInput" />
        </label>
      </div>

      <!-- Preview -->
      <div id="preview-container" style="margin-top:16px;">
        <img id="preview" src="" alt="Aperçu de l'image" />
        <span class="preview-name" id="fileName"></span>
      </div>

      <div style="margin-top: 20px;" class="btn-row">
        <button type="button" class="btn btn-secondary" id="clearBtn"
                style="display:none;" onclick="clearImage()">
          ✕ Effacer
        </button>
        <button type="button" class="btn btn-primary" id="submitBtn" disabled
                onclick="analyzeImage()">
          🔍 Analyser
        </button>
      </div>
    </div>

    <!-- Spinner -->
    <div id="spinner" style="display:none;">
      <div class="spinner-ring"></div>
      <span class="spinner-label">Analyse en cours…</span>
    </div>

    <!-- Result target -->
    <div id="result"></div>

  </main>

  <footer>Propulsé par Groq · Llama 4 Scout · HTMX</footer>

  <script>
    const fileInput  = document.getElementById('fileInput');
    const cameraInput = document.getElementById('cameraInput');
    const dropZone   = document.getElementById('dropZone');
    const preview    = document.getElementById('preview');
    const previewCon = document.getElementById('preview-container');
    const fileName   = document.getElementById('fileName');
    const submitBtn  = document.getElementById('submitBtn');
    const clearBtn   = document.getElementById('clearBtn');
    const spinner    = document.getElementById('spinner');
    const result     = document.getElementById('result');

    // Fichier actuellement sélectionné
    let selectedFile = null;

    // ── Shared handler ─────────────────────────────────────────────────
    function handleFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      selectedFile = file;
      result.innerHTML = '';

      const reader = new FileReader();
      reader.onload = e => {
        preview.src = e.target.result;
        previewCon.classList.add('visible');
        fileName.textContent = file.name;
        submitBtn.disabled = false;
        clearBtn.style.display = '';
        dropZone.style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    // ── Inputs ────────────────────────────────────────────────────────
    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) handleFile(fileInput.files[0]);
    });

    cameraInput.addEventListener('change', () => {
      if (cameraInput.files[0]) handleFile(cameraInput.files[0]);
    });

    // ── Drag & drop ──────────────────────────────────────────────────
    dropZone.addEventListener('dragover', e => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    // ── Analyse via fetch ─────────────────────────────────────────────
    async function analyzeImage() {
      if (!selectedFile) return;

      submitBtn.disabled = true;
      spinner.style.display = 'flex';
      result.innerHTML = '';

      const formData = new FormData();
      formData.append('file', selectedFile);

      try {
        const res = await fetch('/analyze', { method: 'POST', body: formData });
        const html = await res.text();
        result.innerHTML = html;
        result.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } catch (err) {
        result.innerHTML =
          '<div class="result-card"><div class="result-icon">⚠️</div>' +
          '<div class="result-text"><p>Erreur réseau : ' + err.message + '</p></div></div>';
      } finally {
        spinner.style.display = 'none';
        submitBtn.disabled = false;
      }
    }

    // ── Clear ─────────────────────────────────────────────────────────
    function clearImage() {
      selectedFile = null;
      fileInput.value = '';
      cameraInput.value = '';
      preview.src = '';
      previewCon.classList.remove('visible');
      fileName.textContent = '';
      submitBtn.disabled = true;
      clearBtn.style.display = 'none';
      dropZone.style.display = '';
      result.innerHTML = '';
    }
  </script>
</body>
</html>
